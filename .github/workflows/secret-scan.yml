name: Secret Scanning Security Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  scan-secrets:
    name: Secret Scan & Notify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks scan
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source /repo \
            --report-format json \
            --report-path /repo/gitleaks-report.json \
            --redact \
            --exit-code 1

      - name: Post findings to PR
        if: steps.gitleaks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const reportPath = 'gitleaks-report.json';
            const raw = fs.readFileSync(reportPath, 'utf8');
            const findings = JSON.parse(raw);

            const files = [...new Set(findings.map(f => f.File).filter(Boolean))].sort();
            const list = files.length
              ? files.map(f => `- ${f}`).join('\n')
              : '- (no file path found in report)';

            const body = [
              '## 🔒 Secret scan failed',
              '',
              `Detected **${findings.length}** potential secret(s) in **${files.length}** file(s).`,
              '',
              '### Affected files',
              list,
              '',
              '### Remediation steps',
              '1. Remove hardcoded secrets from source code.',
              '2. Move sensitive values to GitHub Actions Secrets / environment variables.',
              '3. Rotate and revoke any exposed credentials immediately.',
              '4. Re-run the workflow after cleanup.'
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- secret-scan-comment -->';
            const finalBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: finalBody
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: finalBody
              });
            }

      - name: Block Merge Check
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "Secret scanning failed. See PR comment for details."
          exit 1