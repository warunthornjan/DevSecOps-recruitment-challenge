name: Secret Scanning Security Gate

on:
  pull_request:
    branches: 
      - main

jobs:
  scan-secrets:
    name: Secret Scan & Notify
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 #stable
        with:
          fetch-depth: 0 

      - name: Run Gitleaks Scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true 

      - name: Post Findings to PR
        if: steps.gitleaks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            Security Alert: Secrets Error detect
            
            1. src/config.js please check
            2. src/db.js please check
            
      - name: Block Merge Check
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "Secret scanning failed"
          exit 1